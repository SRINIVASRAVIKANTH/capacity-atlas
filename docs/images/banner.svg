<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Capacity Atlas: hosting capacity across New York, checked weekly">
<style>
.bg{fill:#171a21}
.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 2.2s ease-out forwards, glow 4s ease-in-out 2.4s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
.sub{fill:#fff;animation:pulse 2s ease-in-out infinite}
.ring{fill:none;stroke:#8ef4ff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.t{font-family:"Space Grotesk","Segoe UI",Helvetica,Arial,sans-serif;font-weight:700;font-size:64px;fill:#e8e6e1;letter-spacing:-1px}
.s{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;font-size:21px;fill:#9a9fad}
.k{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#9a9fad}
.fade{opacity:0;animation:fadein 1s ease-out forwards}
@keyframes fadein{to{opacity:1}}
.eye{fill:#8ef4ff;transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bolt{fill:#f0f921;transform-box:fill-box;transform-origin:bottom center;animation:zap 2.6s infinite}
@keyframes zap{0%,70%,100%{transform:scale(1)}78%{transform:scale(1.3) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
</style>
