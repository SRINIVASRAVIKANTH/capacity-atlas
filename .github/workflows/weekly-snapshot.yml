# Weekly run: download every utility, check quality, compare with last week, publish results.
#
# Big data files (GeoParquet snapshots) go to a GitHub Release.
# The web map's data (atlas.pmtiles, summary.json and history.json) goes to Cloudflare R2.
# Small reports (quality reports, change reports, metadata, LATEST.md, and the feeder capacity
# history in reports/history/) are committed to the repository.

name: Weekly snapshot

on:
  schedule:
    - cron: "0 10 * * 1"   # every Monday 10:00 UTC (GitHub may start it a little late)
  workflow_dispatch:         # also lets you start it by hand from the Actions tab

permissions:
  contents: write            # needed to commit reports and create releases

env:
  TIPPECANOE_COMMIT: 4f2621186acfec33b63ddf636f665623c0fef2dd   # exact tippecanoe version we tested
  R2_BUCKET: capacity-atlas

concurrency:
  group: weekly-snapshot     # never run two copies at the same time
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # whole job; the download step has its own, shorter limit

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run tests (stop here if anything is broken)
        run: pytest

      - name: Download the last good snapshot of every utility (for comparison)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Newest release first. A release can be missing a utility (for example a run stopped
          # by its time limit), so keep looking in older releases until every utility is found.
          mkdir -p data/previous
          sources=$(python -c "from capacity_atlas.sources import SOURCES; print(' '.join(SOURCES))")
          for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName'); do
            missing=()
            for s in $sources; do
              compgen -G "data/previous/${s}_*.parquet" > /dev/null || missing+=("$s")
            done
            [ ${#missing[@]} -eq 0 ] && break
            for s in "${missing[@]}"; do
              gh release download "$tag" --pattern "${s}_*.parquet" --dir data/previous 2> /dev/null \
                && echo "$s: previous snapshot from $tag"
            done
          done
          ls -la data/previous

      - name: Run pipeline for every source
        id: pipeline
        continue-on-error: true   # still publish what succeeded if one utility fails
        timeout-minutes: 100      # leave time for tiles, reports and the release if a server is slow
        run: python -m capacity_atlas.pipeline --all --previous data/previous

      - name: Update the feeder capacity history
        id: history
        if: always()
        continue-on-error: true   # a history problem must not stop the map, reports or snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The history keeps every feeder's highest capacity per snapshot date. Any date it does
          # not have yet is filled in from the releases (the first time: all of them), then this
          # run's snapshots are added. Release files are named <source_id>_<date>.parquet.
          mkdir -p data/history-src data/tiles
          known=$(python -m capacity_atlas.history --out reports/history/feeder_capacity.json --known-dates)
          for tag in $(gh release list --limit 60 --json tagName --jq '.[].tagName'); do
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              stem="${asset%.parquet}"
              [ "$stem" = "$asset" ] && continue                          # not a snapshot
              grep -qxF "$stem" <<< "$known" && continue                  # already in the history
              [ -e "data/previous/$asset" ] || [ -e "data/history-src/$asset" ] && continue
              gh release download "$tag" --pattern "$asset" --dir data/history-src \
                && echo "History: $asset from $tag"
            done
          done
          python -m capacity_atlas.history --data data/snapshots \
            --previous data/previous data/history-src \
            --out reports/history/feeder_capacity.json
          cp reports/history/feeder_capacity.json data/tiles/history.json

      - name: Restore tippecanoe (map tile tool) from cache
        id: tippecanoe-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/tippecanoe
          key: tippecanoe-${{ runner.os }}-${{ env.TIPPECANOE_COMMIT }}

      - name: Build tippecanoe (only when not cached)
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev
          git clone --quiet https://github.com/felt/tippecanoe.git /tmp/tippecanoe-src
          cd /tmp/tippecanoe-src
          git checkout --quiet "$TIPPECANOE_COMMIT"
          make -j"$(nproc)" > /dev/null
          mkdir -p ~/.local/tippecanoe
          cp tippecanoe ~/.local/tippecanoe/
          ~/.local/tippecanoe/tippecanoe --version

      - name: Build map data for every source
        id: tiles
        if: always()
        continue-on-error: true   # a tile problem must not stop reports and snapshots from publishing
        run: |
          python -m capacity_atlas.tiles \
            --previous data/previous \
            --out data/tiles/atlas.pmtiles \
            --tippecanoe ~/.local/tippecanoe/tippecanoe

      - name: Upload map data to Cloudflare R2
        id: upload-tiles
        if: steps.tiles.outcome == 'success'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto                        # R2 ignores the region but the tool requires one
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required  # keep uploads compatible with R2
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 secrets are not set; skipping the map upload."
            exit 0
          fi
          # Accept either the bare Account ID or the full endpoint URL pasted from Cloudflare.
          account="$(echo "$R2_ACCOUNT_ID" | tr -d '[:space:]')"
          account="${account#https://}"
          account="${account%%.*}"
          if ! [[ "$account" =~ ^[0-9a-f]{32}$ ]]; then
            echo "R2_ACCOUNT_ID does not look like a Cloudflare Account ID (32 letters/numbers)."
            echo "Paste only the part between https:// and .r2.cloudflarestorage.com"
            exit 1
          fi
          endpoint="https://${account}.r2.cloudflarestorage.com"
          # The map file first, then the summary, so the site never describes tiles it can't load yet.
          aws s3 cp data/tiles/atlas.pmtiles "s3://${R2_BUCKET}/atlas.pmtiles" \
            --endpoint-url "$endpoint" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=3600" \
            --only-show-errors
          aws s3 cp data/tiles/summary.json "s3://${R2_BUCKET}/summary.json" \
            --endpoint-url "$endpoint" \
            --content-type application/json \
            --cache-control "public, max-age=300" \
            --only-show-errors
          # The capacity history is optional: the map works without it.
          if [ -f data/tiles/history.json ]; then
            aws s3 cp data/tiles/history.json "s3://${R2_BUCKET}/history.json" \
              --endpoint-url "$endpoint" \
              --content-type application/json \
              --cache-control "public, max-age=300" \
              --only-show-errors
          fi
          echo "Uploaded. Checking the files now in R2:"
          keys="atlas.pmtiles summary.json"
          [ -f data/tiles/history.json ] && keys="$keys history.json"
          for key in $keys; do
            aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$endpoint" \
              --query "{file: '$key', size: ContentLength, modified: LastModified}"
          done

      - name: Commit reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Weekly snapshot reports $(date -u +%Y-%m-%d)"
          # Someone (or an earlier run) may have pushed while this run was working.
          # Bring in their changes first; if both touched the same report, keep this run's version.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          echo "Could not push reports after 3 attempts."
          exit 1

      - name: Upload snapshots to a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          for f in data/snapshots/*/*.parquet; do
            source_id=$(basename "$(dirname "$f")")
            renamed="data/${source_id}_$(basename "$f")"
            cp "$f" "$renamed"
            files+=("$renamed")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No snapshots to upload."
            exit 0
          fi
          tag="snapshot-$(date -u +%Y-%m-%d)"
          target="$(git rev-parse HEAD)"   # the commit that contains this run's reports
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$target" \
              --title "Snapshot $(date -u +%Y-%m-%d)" \
              --notes "Weekly hosting capacity snapshots. See reports/LATEST.md for the quality and change summary."
          fi

      - name: Fail the run if anything above failed
        if: >-
          steps.pipeline.outcome == 'failure' ||
          steps.tiles.outcome == 'failure' ||
          steps.upload-tiles.outcome == 'failure'
        run: |
          echo "Pipeline: ${{ steps.pipeline.outcome }}"
          echo "Map tiles: ${{ steps.tiles.outcome }}"
          echo "Upload to R2: ${{ steps.upload-tiles.outcome }}"
          echo "See the failed step above and reports/LATEST.md."
          exit 1
